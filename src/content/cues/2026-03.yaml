  - date: 2026-03-03
    label: "Mar 3"
    items:
      - tag: "Music"
        text: "[No madness](https://www.youtube.com/watch?v=N4RdKBt8qpU): interesting piece of modern Indian music recommended to me by a PhD student exploring opportunities of intersection between AI and Indian traditional music here at MIT."
      - tag: "Music"
        text: "[Basement Bhangra](https://youtu.be/C9qbZqrzbas?si=-QMcBRP3n176o5oa), from NYC-based artist DJ Rekha: more on “contemporary” fusion Indian music. Bhangra is a high-energy traditional folk dance originating from the region of Punjab. The music is played during the celebrations for the harvest season (April/May). This is an interesting blend between bhangra and dance/electronic music."
      - tag: "Poetry"
        text: "[Harlem](https://stuff.mit.edu/people/dpolicar/writing/poetry/poems/harlem.html). This poem, written by one of the main figures of the Harlem Renaissance, is so touching. I particularly appreciated the metaphor of the raisin drying in the sun."
      - tag: "Computer Science"
        text: "[Dmitry Krotov, Generative AI model through the lense of Dense Associative Memory](https://www.youtube.com/watch?v=lzYwzIkO89Q). Interesting talk about Energy-based models."
  - date: 2026-03-05
    label: "Mar 5"
    items:
      - tag: "Music"
        text: "[Raymond Scott](https://en.wikipedia.org/wiki/Raymond_Scott): American composer and producer, a pioneer of electronica. Apart from his impressive “musical resume”, spanning across multiple genres, I got to know about him when I attended a lecture on synthesizers at MIT, and I was particularly amused by this experimental work I’m pasting below:"
        sub:
          - text: "[Soothing Sounds for Baby](https://en.wikipedia.org/wiki/Soothing_Sounds_for_Baby): a collection of… ambient electronic music originally meant to help his baby sleep. Link to Youtube [here](https://youtu.be/hGk3HYcgkPQ?si=ktnyDteh2F6NDibB). I swear, this is so sweet and simple, and so… trippy at the same time!"
      - tag: "Music"
        text: "[Reconsidering Raymond Scott](https://www.wbgo.org/music/2018-10-19/reconsidering-composer-raymond-scott-from-cartoons-to-the-cutting-edge-in-deep-dive): another article about him."
      - tag: "Music"
        text: "[Vangelis](https://youtu.be/Hqe-gakCb24?si=2B8lZwF98rp-bjjt), another great composer of the 20th century who experimented a lot with synths and electronic music. Among other things, known to the great public as composer of the “Blade Runner” soundtrack."
        sub:
          - text: "[This](https://youtu.be/GWggDMDhwIA?si=LuXk1kq_N5bv8lEw) video is an astonishing demonstration of what he could get out of a synth! It was incredible to watch for me, this man is an orchestra."
  - date: 2026-03-07
    label: "Mar 7"
    items:
      - tag: "Journalism"
        text: "I’ve been following, remotely, a super interesting elective class at ETH on Dorothy Parker, a poet and journalist of the early 20th century. There are many things that I could say and share about her, but here I want to leave the link to this beautiful “love letter” to New York. [Dorothy Parker on New York](https://polyarchive.com/dorothy-parker-on-new-york-autumn-is-the-springtime-of-big-cities/): “London is satisfied, Paris is resigned, but New York is always hopeful”."
